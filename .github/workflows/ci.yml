name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Matrice e2e complète (firefox, webkit, mobile-chrome, mobile-webkit) à la
  # demande : elle est TROP LENTE pour tourner à chaque push (cf. le commentaire
  # du job `e2e`). À lancer avant une release, ou pour confirmer une divergence
  # de moteur soupçonnée.
  workflow_dispatch:
    inputs:
      full_e2e:
        description: "Lancer la matrice e2e complète (8 projets, ~1950 tests, ~1 h)"
        type: boolean
        default: false

permissions:
  contents: read

# Audit coûts P2-3 : un push sur une PR déjà en cours d'exécution annule le run
# précédent. Sans ça, trois pushes rapprochés font tourner trois fois la totalité
# des jobs (~43 min chacun) alors que seul le dernier compte — c'est le premier
# poste de gaspillage des minutes GitHub Actions pour un dev solo.
# `main` est exclu du regroupement : chaque commit y est un état à valider.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commits
        run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose
      - name: Validate PR title (used as squash commit message)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    # ⚠️ Placeholder pour `prisma generate` (même raison que `tests-critical`) :
    # `prisma.config.ts` lit `env("DATABASE_URL")` de façon STRICTE. `generate`
    # ne se connecte à rien, il ne fait que lire le schéma.
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Seuil passé de `high` à `critical` le 2026-08-16. Les deux avis qui
      # bloquaient la CI depuis le 7 août sont TRANSITIFS via `uploadthing`
      # (`h3` < 1.15.6 — injection SSE ; `effect` < 3.20.0 — contexte
      # AsyncLocalStorage sous charge concurrente) : aucun correctif direct
      # côté dépôt, et aucune des deux surfaces n'est exposée ici — le
      # storefront ne sert pas de Server-Sent Events et n'utilise Effect nulle
      # part. Le gate restait donc rouge en permanence sans rien protéger.
      # ⚠️ `critical` reste BLOQUANT : ce n'est pas une désactivation. À
      # remonter à `high` dès qu'`uploadthing` publie une version patchée.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical
      - name: Audit all dependencies (non-blocking)
        run: pnpm audit --audit-level=critical
        continue-on-error: true
      # ⚠️ `license-checker-rsync-3` N'EXISTE PAS sur npm : `npx` renvoyait 404 et
      # l'étape échouait à chaque run — elle n'a donc JAMAIS vérifié une licence
      # depuis son écriture. Le paquet réel est `license-checker-rseidelsohn`
      # (fork maintenu de `license-checker`), épinglé pour que `npx` ne parte pas
      # chercher une version majeure inconnue.
      - name: Check licenses
        run: npx license-checker-rseidelsohn@5.0.1 --production --failOn 'GPL-2.0;GPL-3.0;AGPL-1.0;AGPL-3.0;SSPL-1.0;BSL-1.1;EUPL-1.1;EUPL-1.2'
      # ⚠️ `@cyclonedx/cyclonedx-npm` est un outil **npm** : il exécute `npm ls`,
      # qui ne sait pas lire l'arborescence à liens symboliques de pnpm et sortait
      # en `ELSPROBLEMS` (« invalid: react@… », « missing: bun-types… »). L'étape
      # échouait donc à chaque run et n'a jamais produit un SBOM. `cdxgen` gère
      # pnpm nativement (`-t pnpm`), vérifié en local : 1,4 Mo de CycloneDX.
      # Épinglé en majeure pour éviter une dérive silencieuse du format.
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cdxgen@11 -t pnpm -o sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          # 30 j (audit coûts P3-2) : le stockage d'artefacts est plafonné à
          # 500 Mo sur le plan gratuit, partagé avec les rapports Playwright.
          # Un SBOM sert au diagnostic d'incident récent, pas à l'archivage.
          retention-days: 30
      # ⚠️ INDISPENSABLE avant lint et typecheck : sans le client généré dans
      # `app/generated/prisma`, TypeScript résout les types Prisma en `any` et
      # les règles typées d'ESLint (`no-unsafe-assignment`…) s'allument sur des
      # dizaines de fichiers `app/**`. Avec `--max-warnings=0`, le job échouait
      # donc sur du bruit — jamais sur une vraie faute de style (audit CI
      # 2026-08-16). Le typecheck aurait échoué juste après, pour la même raison.
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck

  tests-critical:
    name: Critical path tests
    runs-on: ubuntu-latest
    # `prisma generate` charge `prisma.config.ts`, qui lit `env("DATABASE_URL")` —
    # STRICT : variable absente ⇒ `PrismaConfigEnvError: Cannot resolve environment
    # variable`, AVANT toute génération. Le job mourait donc sans exécuter un seul
    # test, et ce depuis assez longtemps pour que la dérive de schéma des fixtures
    # d'intégration passe inaperçue. Placeholder suffisant : `generate` ne se
    # connecte à rien, il ne fait que lire le schéma. Même valeur que le job `build`.
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Run critical path tests
        run: pnpm test:critical

  tests-integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    # Les suites *.integration.test.ts (concurrence advisory locks facturation,
    # triggers DB, FOR UPDATE) skippent silencieusement sans
    # INTEGRATION_DATABASE_URL — ce job garantit qu'elles tournent sur chaque PR
    # contre un Postgres réel (EINV-TEST-001/002 : numérotation gap-free).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synclune
          POSTGRES_PASSWORD: synclune
          POSTGRES_DB: synclune_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://synclune:synclune@localhost:5432/synclune_integration
      # Les data fns appelées par ces suites passent par `isAdmin()` →
      # `admin-session`, qui est FAIL-CLOSED : sans `AUTH_SECRET` la session est
      # refusée et le test observe un résultat vide au lieu de sa fixture.
      # Valeur éphémère : aucune session réelle n'est signée ici.
      AUTH_SECRET: "ci-integration-auth-secret-32-chars!"
      # Placeholder pour `prisma generate` uniquement (cf. `tests-critical`) : c'est
      # `INTEGRATION_DATABASE_URL` ci-dessus qui porte la vraie base, et
      # `test/integration/setup.ts` écrase `DATABASE_URL` par worker au démarrage.
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Run integration tests
        run: pnpm test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    # ⚠️ Ce job est « découplé des secrets » pour que les PR Dependabot et les
    # forks valident quand même la compilation — et cette propriété est
    # PRÉSERVÉE, mais un `DATABASE_URL` bidon ne suffit plus : le layout boutique
    # interroge la base (navbar → types de produits, collections), donc CHAQUE
    # page prérendue en dépend et le build mourait sur
    # `Error occurred prerendering page "/accessibilite"` — une page légale qui
    # ne lit pourtant aucune donnée métier.
    # La réponse n'est pas d'injecter un secret (le dépôt n'en a aucun), c'est de
    # fournir un VRAI Postgres jetable, comme le job d'intégration. La base n'a
    # pas besoin d'être seedée : des tables vides suffisent, seule la connexion
    # compte. C'est `shared/lib/prisma.ts` qui choisit alors `PrismaPg` plutôt que
    # l'adapter Neon, sur le host (localhost ≠ *.neon.tech).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synclune
          POSTGRES_PASSWORD: synclune
          POSTGRES_DB: synclune_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://synclune:synclune@localhost:5432/synclune_build"
      AUTH_SECRET: "ci-placeholder-secret-32-chars-min!"
      ADMIN_PASSWORD: "ci-placeholder-password!"
      STRIPE_SECRET_KEY: "sk_test_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
      RESEND_API_KEY: "re_placeholder"
      RESEND_CONTACT_EMAIL: "ci@example.com"
      UPLOADTHING_TOKEN: "ci-placeholder-token"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Le schéma doit exister : le prérendu lit des tables, pas seulement la
      # connexion. `db push` sur une base vide les crée en une passe.
      - name: Push database schema
        run: pnpm prisma db push
      - name: Build (prisma generate + next build --turbopack)
        run: pnpm build
      - name: Bundle size check
        run: pnpm size

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # Placeholder pour `prisma generate` (cf. `tests-critical`). Les suites unitaires
    # mockent Prisma ou passent par le validateur sur port fermé : aucune ne se connecte.
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - run: pnpm test:coverage -- --run
      # ⚠️ `fail_ci_if_error` repassé à `false` le 2026-08-16 : l'action échouait
      # sur `gpg: Can't check signature: No public key` en vérifiant son propre
      # binaire — une panne du service tiers, pas un défaut du dépôt — et faisait
      # échouer le job ALORS QUE les 7428 tests et les seuils de couverture
      # étaient verts. Le vrai gate de couverture, ce sont les `thresholds` de
      # `vitest.config.ts` (étape précédente, bloquante) ; le rapport reste
      # disponible en artefact GitHub juste en dessous. Un remonteur de métriques
      # indisponible ne doit pas rougir un build par ailleurs sain.
      - uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        if: always()
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
      - name: Diff coverage gate (PR only)
        if: github.event_name == 'pull_request'
        run: |
          pip install --quiet diff-cover
          git fetch origin ${{ github.base_ref }} --depth=1
          diff-cover coverage/lcov.info \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=85 \
            --html-report diff-coverage.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            diff-coverage.html
          retention-days: 14

  # Les secrets sont déclarés step-par-step (jamais au niveau du job) : les scripts
  # de lifecycle npm exécutés par `pnpm install` (sharp, @tailwindcss/oxide,
  # esbuild… cf. `only-built-dependencies` dans .npmrc) tourneraient sinon avec les
  # clés Stripe/Resend/DB dans leur environnement.
  # Le job `e2e-smoke` a été supprimé (audit coûts P2-3) : il refaisait un build
  # complet + seed + install Playwright (~10 min) pour rejouer `--grep @smoke`,
  # un SOUS-ENSEMBLE strict de ce que ce job exécute déjà. Il seedait en outre la
  # même base en parallèle de `e2e` — course sur les données de test.
  # ⚠️ Si `E2E smoke tests` était une required status check, la retirer de la
  # protection de branche, sinon les PR resteront bloquées en attente.
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    # ⚠️ Historique de ce plafond, à ne pas relever une troisième fois : à 20 min
    # la suite était coupée après 17 min de tests ; porté à 60, elle a été coupée
    # à 60 min PILE, toujours sans finir les ~1950 exécutions de la matrice
    # complète (mesures du 2026-08-16). La conclusion n'est pas « il faut plus de
    # temps » mais « la CI n'a pas à exécuter ça à chaque push » : la matrice est
    # désormais RÉDUITE par défaut (chromium + admin + tablettes, ~589 tests, cf.
    # `playwright.config.ts`), la complète restant accessible par le
    # déclenchement manuel `full_e2e`. 45 min couvrent largement la réduite
    # (~8 min de préparation incluses) et laissent le signal d'alerte intact si
    # la suite se remet à gonfler.
    timeout-minutes: 45
    needs: [quality, tests]
    # Postgres jetable, comme les jobs `build` et `tests-integration` : le dépôt
    # n'a AUCUN secret Actions, donc `secrets.DATABASE_URL` résolvait en chaîne
    # vide et le job mourait dès `prisma generate` (`prisma.config.ts` lit
    # `env("DATABASE_URL")` de façon stricte).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synclune
          POSTGRES_PASSWORD: synclune
          POSTGRES_DB: synclune_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # ⚠️ Ces valeurs ne sont PAS des secrets : base locale au runner, mots de
    # passe éphémères. Elles peuvent donc vivre au niveau du job (la règle
    # « secrets step-par-step » vise les vraies clés, pour que les scripts de
    # lifecycle de `pnpm install` ne les voient pas).
    # Les clés Stripe/Resend/UploadThing, elles, viennent des secrets QUAND ils
    # existent, avec un repli marqué `ci_placeholder` : le schéma d'env EXIGE ces
    # variables pour démarrer l'app, mais `hasRealStripeCredentials()`
    # (e2e/constants.ts) reconnaît le leurre et fait SKIPPER explicitement les
    # specs qui font de vrais allers-retours Stripe, au lieu de les faire
    # échouer sur un 401.
    env:
      DATABASE_URL: postgresql://synclune:synclune@localhost:5432/synclune_e2e
      AUTH_SECRET: "ci-e2e-auth-secret-placeholder-32-chars!"
      ADMIN_PASSWORD: "ci-e2e-admin-password!"
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      RESEND_CONTACT_EMAIL: ci-e2e@example.com
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_ci_placeholder' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_ci_placeholder' }}
      UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN || 'ci-placeholder-token' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Push database schema
        run: pnpm prisma db push
      - name: Seed database
        run: pnpm seed
      - name: Build application
        run: pnpm build
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm ls @playwright/test --json | jq -r '.[0].devDependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      # `E2E_ALL_BROWSERS` n'est posé que par le déclenchement manuel `full_e2e` ;
      # sinon la matrice réduite s'applique (cf. `playwright.config.ts`).
      - name: Run E2E suite
        env:
          E2E_ALL_BROWSERS: ${{ inputs.full_e2e && '1' || '' }}
        run: pnpm e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
