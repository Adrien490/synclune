name: Visual Regression - Update Snapshots
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for updating snapshots"
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      # Les secrets sont exposés step-par-step (et JAMAIS au niveau du job) : les
      # scripts de lifecycle npm exécutés par `pnpm install` (sharp,
      # @tailwindcss/oxide, esbuild… cf. `only-built-dependencies` dans .npmrc)
      # tourneraient sinon avec les clés Stripe/Resend/DB dans leur environnement.
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Push database schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm prisma db push --skip-generate
      - name: Seed database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm seed
      - name: Build application
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Auth maison (migration lean) : valeurs éphémères, serveur local au runner.
          AUTH_SECRET: "ci-e2e-auth-secret-placeholder-32-chars!"
          ADMIN_PASSWORD: "ci-e2e-admin-password!"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_CONTACT_EMAIL: ci-e2e@example.com
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
        run: pnpm build
      # Les 5 navigateurs : les snapshots commités couvrent chromium, firefox,
      # webkit, mobile-chrome et mobile-webkit — n'en régénérer qu'un laisserait
      # les 4 autres périmés.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Update visual regression snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Auth maison (migration lean) : valeurs éphémères, serveur local au runner.
          AUTH_SECRET: "ci-e2e-auth-secret-placeholder-32-chars!"
          ADMIN_PASSWORD: "ci-e2e-admin-password!"
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_CONTACT_EMAIL: ci-e2e@example.com
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
        # ⚠️ Cibler le FICHIER visuel, pas `--grep @slow` : le tag est partagé
        # avec l'a11y et le SEO, que ce workflow relançait pour rien.
        run: pnpm e2e visual-regression.spec.ts --update-snapshots --project=chromium --project=firefox --project=webkit --project=mobile-chrome --project=mobile-webkit
      - name: Create PR with updated snapshots
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: "test: update visual regression snapshots"
          title: "test: update visual regression snapshots"
          body: |
            ## Visual Regression Snapshot Update

            **Reason:** ${{ inputs.reason }}

            Triggered manually via workflow dispatch.

            Please review the screenshot diffs carefully before merging.
          branch: update-visual-snapshots
          delete-branch: true
